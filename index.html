<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PULSE — One beat. Your workout. Our progress.</title>
    <!-- NFR-06: startup loading state. Inline so it paints before the JS bundle and
         index.css load; colours copied from the light theme in src/index.css.
         React replaces #root's contents once store.init() finishes (src/main.tsx). -->
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #fafaf8;
        color: #1c1917;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .pulse-boot {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 1.5rem;
        box-sizing: border-box;
        text-align: center;
      }
      .pulse-boot-brand {
        margin: 0;
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: 0.06em;
        color: #cf3a1c;
      }
      .pulse-boot-beat {
        display: flex;
        gap: 0.4rem;
        height: 1.5rem;
        align-items: center;
      }
      .pulse-boot-beat span {
        width: 0.4rem;
        height: 100%;
        border-radius: 999px;
        background: #f0502f;
        animation: pulse-boot-beat 1s ease-in-out infinite;
      }
      .pulse-boot-beat span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .pulse-boot-beat span:nth-child(3) {
        animation-delay: 0.3s;
      }
      .pulse-boot-text {
        margin: 0;
        color: #625c56;
        font-size: 1rem;
      }
      @keyframes pulse-boot-beat {
        0%,
        100% {
          transform: scaleY(0.35);
          opacity: 0.5;
        }
        50% {
          transform: scaleY(1);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse-boot-beat span {
          animation: none;
          transform: scaleY(0.6);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="pulse-boot" role="status" aria-live="polite">
        <p class="pulse-boot-brand">PULSE</p>
        <div class="pulse-boot-beat" aria-hidden="true"><span></span><span></span><span></span></div>
        <p class="pulse-boot-text">Warming up your dances…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
